    password: "supersecretpassword"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
keycloak:
  auth-server-url: "http://localhost:8081"
  realm: "yg-cloud-realm"
server:
  port: 8080
